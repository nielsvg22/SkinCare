workflows:
  ios-altstore:
    name: iOS — AltStore build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      groups:
        # Create this group yourself in Codemagic → Teams → Code signing
        # identities, and add your Apple Distribution certificate + an
        # Ad Hoc (or Development) provisioning profile for the app id
        # nl.nielsvg22.verzorgingsroutine. Codemagic exposes them to this
        # build as $CM_CERTIFICATE / $CM_PROVISIONING_PROFILE automatically
        # once referenced here by group name.
        - ios_signing
      vars:
        BUNDLE_ID: "nl.nielsvg22.verzorgingsroutine"
      xcode: latest
      node: latest
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Sync Capacitor iOS project
        script: npx cap sync ios
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_ADHOC || true
          keychain add-certificates
          xcode-project use-profiles
      - name: Build unsigned archive
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App" \
            --archive-flags="-destination 'generic/platform=iOS'"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - maartenvangortel@gmail.com
        notify:
          success: true
          failure: true
